name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flashsale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FlashSale.sln

      - name: Build (Release)
        run: dotnet build FlashSale.sln -c Release --no-restore

      - name: Unit Test (Domain)
        run: dotnet test tests/FlashSale.Domain.Tests -c Release --no-build --verbosity normal

      - name: Unit Test (Application)
        run: dotnet test tests/FlashSale.Application.Tests -c Release --no-build --verbosity normal

      - name: Integration Test (Infrastructure)
        run: dotnet test tests/FlashSale.Infrastructure.Tests -c Release --no-build --verbosity normal

      - name: Integration Test (Api)
        run: dotnet test tests/FlashSale.Api.Tests -c Release --no-build --verbosity normal

      - name: Integration Test (Worker)
        run: dotnet test tests/FlashSale.Worker.Tests -c Release --no-build --verbosity normal
