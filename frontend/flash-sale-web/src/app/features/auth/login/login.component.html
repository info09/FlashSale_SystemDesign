<section class="card login-card">
  <div class="card-hero">
    <span class="eyebrow">FlashSale Access</span>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Đăng nhập để nhận BearerToken và gọi API mua hàng FlashSale.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <ui-form-field
      label="Tên đăng nhập"
      [required]="true"
      forId="login-username"
      [loading]="loading()"
      [error]="form.controls.userName.touched && form.controls.userName.invalid ? 'Vui lòng nhập tên đăng nhập.' : null">
      <input id="login-username" type="text" formControlName="userName" autocomplete="username" [disabled]="loading()" placeholder="Nhập tên đăng nhập" />
    </ui-form-field>

    <ui-form-field
      label="Mật khẩu"
      [required]="true"
      forId="login-password"
      [loading]="loading()"
      [error]="form.controls.password.touched && form.controls.password.invalid ? 'Vui lòng nhập mật khẩu.' : null">
      <input id="login-password" type="password" formControlName="password" autocomplete="current-password" [disabled]="loading()" placeholder="Nhập mật khẩu" />
    </ui-form-field>

    @if (errorMessage()) {
      <div class="alert error" role="alert"><span class="alert-icon">!</span><span>{{ errorMessage() }}</span></div>
    }

    <button class="btn primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>
</section>
