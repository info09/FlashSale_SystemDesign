global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "flashsale-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["flashsale-api:8080"]

  - job_name: "flashsale-worker"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["flashsale-worker:8080"]
